name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Type-check and build
        run: npm run build

  production-smoke:
    name: production-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Wait for the exact Render deploy
        env:
          PLAYWRIGHT_BASE_URL: https://merchant-app-web.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/wait-for-deploy.mjs
      - name: Run production smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://merchant-app-web.onrender.com
        run: npm run test:e2e:production
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
