services:
  - type: web
    name: merchant-app-web
    runtime: static
    buildCommand: npm ci && VITE_BUILD_SHA=$RENDER_GIT_COMMIT npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://fastapi-merchant-app.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fastapi-merchant-app.onrender.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
