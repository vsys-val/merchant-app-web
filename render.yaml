services:
  - type: web
    name: merchant-app-web
    runtime: static
    buildCommand: npm ci && VITE_BUILD_SHA=$RENDER_GIT_COMMIT npm run build
    staticPublishPath: ./dist
    routes:
      # A API na mesma origem do site: o cookie de sessão HttpOnly é primário
      # (onrender.com está na Public Suffix List). Precisa vir antes da regra da SPA.
      - type: rewrite
        source: /api/*
        destination: https://fastapi-merchant-app.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://fastapi-merchant-app.onrender.com/health
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
